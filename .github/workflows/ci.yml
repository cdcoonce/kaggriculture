# PR fast set (test-pyramid decision #3) plus a path-filtered, crash-only
# smoke check against the gate zoo's scripted opponents (issue #29). The
# smoke check is NOT the reduced-H2H strength/promotion gate — that
# statistical bar still lands with the CI-topology decision (#12); this job
# only fails on a candidate crash.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fast-set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --all-packages --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages/agent/src
      - run: uv run pytest -m "not slow" -q
      - run: uv run pytest -m slow -q

  # The marker split above is a fast-feedback device, not a full run: it happens
  # to partition the suite in a way that hid an ordering-dependent import leak
  # for months (a bare `pytest` failed 16 harness tests that both legs passed --
  # see the root conftest.py). This job runs the suite unsplit so cross-marker
  # pollution cannot regress silently again. It is a separate job on purpose, so
  # the duplicated coverage costs runner time but no extra wall-clock.
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --all-packages --dev
      - run: uv run pytest -q

  detect-agent-changes:
    runs-on: ubuntu-latest
    outputs:
      agent-changed: ${{ steps.filter.outputs.agent-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.event.after }}"
          fi
          if ! diff_output=$(git diff --name-only "$base...$head" 2>&1); then
            echo "base $base unresolvable against $head: $diff_output"
            echo "defaulting to run: could not determine whether packages/agent/ changed"
            echo "agent-changed=true" >> "$GITHUB_OUTPUT"
          elif echo "$diff_output" | grep -q '^packages/agent/'; then
            echo "packages/agent/ changed"
            echo "agent-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "packages/agent/ did not change"
            echo "agent-changed=false" >> "$GITHUB_OUTPUT"
          fi

  strength-gate:
    needs: detect-agent-changes
    if: needs.detect-agent-changes.outputs.agent-changed == 'true'
    runs-on: ubuntu-latest
    # Step-level 12min bounds the gate run itself; the job-level bound also
    # covers checkout/setup/sync, which would otherwise inherit GitHub's
    # 360-minute default and let a hung setup burn six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --all-packages --dev
      - run: uv run python -u -m harness.strength_gate
        timeout-minutes: 12
