[project]
name = "agent"
version = "0.1.0"
description = "Kaggriculture submission agent — ships to Kaggle; stdlib + numpy only"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
