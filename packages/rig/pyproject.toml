[project]
name = "rig"
version = "0.1.0"
description = "Kaggriculture tuning rig — CRN seed blocks, racing rungs (never ships)"
requires-python = ">=3.11"
dependencies = [
    "harness",
]

[project.optional-dependencies]
tune = ["optuna>=3"]

[tool.uv.sources]
harness = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rig"]
