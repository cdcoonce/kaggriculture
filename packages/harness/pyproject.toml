[project]
name = "harness"
version = "0.1.0"
description = "Kaggriculture home infrastructure — zoo, gates, ledger, parity (never ships)"
requires-python = ">=3.11"
dependencies = [
    "kaggle-environments==1.32.6",
    "numpy>=1.26",
    "agent",
]

[tool.uv.sources]
agent = { workspace = true }

[project.scripts]
rerun-ledger = "harness.rerun_ledger:main"
# A nicety only: the afk sandbox grants `Bash(uv run python:*)` and nothing
# matches a bare console-script literal, so always invoke the module form
# (`uv run python -m harness.money_gate`) and never depend on this name.
money-gate = "harness.money_gate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]
