[project]
name = "kaggriculture-workspace"
version = "0.1.0"
description = "Workspace root for the Kaggriculture competition agent and harness"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/agent", "packages/harness"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tools", "probe", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "agent.*"
strict = true

[[tool.mypy.overrides]]
module = "kaggle_environments.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages/agent/tests", "packages/harness/tests"]
markers = [
    "slow: long-running suites excluded from the PR fast set",
]
